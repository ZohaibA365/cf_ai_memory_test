name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm test and npm run build compile rust/budget to WebAssembly first.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/budget
      - run: npm ci
      - name: Check generated Worker types are up to date
        run: npx wrangler types && git diff --exit-code worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/budget
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/budget
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build the WebAssembly module
        run: cargo build --release --target wasm32-unknown-unknown

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - run: python -m pytest -q
        working-directory: analysis
      - name: Check the committed report matches the committed data
        run: python analysis/run_analysis.py && git diff --exit-code analysis/report.md
